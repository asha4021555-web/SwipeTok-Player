
name: Swipe Player - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name swipe_player .

      - name: Apply Swipe Player launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path("assets/swipe_player_icon.svg")
          for folder in Path("android/app/src/main/res").glob("mipmap-*"):
              for name in ("ic_launcher.png", "ic_launcher_foreground.png"):
                  target = folder / name
                  if target.exists():
                      size = 192 if "xxxhdpi" in folder.name else 144 if "xxhdpi" in folder.name else 96 if "xhdpi" in folder.name else 72 if "hdpi" in folder.name else 48
                      subprocess.run(["rsvg-convert", "-w", str(size), "-h", str(size), str(source), "-o", str(target)], check=True)
          print("Swipe Player launcher icon applied.")
          PY

      - name: Configure Android Picture-in-Picture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          if "android.permission.WRITE_SETTINGS" not in content:
              content = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.WRITE_SETTINGS" />',
                  content,
                  count=1
              )

          if 'android:supportsPictureInPicture="true"' not in content:
              pattern = r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*)(>)'
              content, count = re.subn(
                  pattern,
                  r'\1 android:supportsPictureInPicture="true"\2',
                  content,
                  count=1,
                  flags=re.S
              )
              if count != 1:
                  raise SystemExit("Could not find MainActivity in AndroidManifest.xml")

          manifest.write_text(content)

          kotlin_files = list(
              Path("android/app/src/main/kotlin").rglob("MainActivity.kt")
          )

          if not kotlin_files:
              raise SystemExit("MainActivity.kt was not found")

          activity = kotlin_files[0]
          old_content = activity.read_text()

          match = re.search(
              r'^\s*package\s+([^\s]+)',
              old_content,
              re.M
          )

          if not match:
              raise SystemExit("Could not detect Kotlin package name")

          package_name = match.group(1)

          new_content = '''package PACKAGE_NAME

          import android.app.PictureInPictureParams
          import android.content.ContentValues
          import android.content.Intent
          import android.content.res.Configuration
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.Settings
          import android.util.Rational
          import java.io.File
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val pipChannelName = "swipe_player/pip"
              private var pipChannel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      "swipe_player/music"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "setRingtone" -> {
                              try {
                                  val path = call.argument<String>("path")
                                  if (path.isNullOrBlank()) {
                                      result.error("INVALID_FILE", "Audio file path is missing.", null)
                                      return@setMethodCallHandler
                                  }
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                                      !Settings.System.canWrite(this)) {
                                      startActivity(Intent(
                                          Settings.ACTION_MANAGE_WRITE_SETTINGS,
                                          Uri.parse("package:$packageName")
                                      ))
                                      result.success(false)
                                      return@setMethodCallHandler
                                  }
                                  val source = File(path)
                                  if (!source.exists() || source.length() == 0L) {
                                      result.error("INVALID_FILE", "Audio file is unavailable.", null)
                                      return@setMethodCallHandler
                                  }
                                  val values = ContentValues().apply {
                                      put(MediaStore.MediaColumns.DISPLAY_NAME,
                                          "SwipePlayer_${System.currentTimeMillis()}_${source.name}")
                                      put(MediaStore.MediaColumns.MIME_TYPE, "audio/*")
                                      put(MediaStore.Audio.Media.IS_RINGTONE, true)
                                      put(MediaStore.Audio.Media.IS_NOTIFICATION, false)
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                          put(MediaStore.MediaColumns.RELATIVE_PATH,
                                              Environment.DIRECTORY_RINGTONES)
                                      }
                                  }
                                  val audioUri = contentResolver.insert(
                                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values
                                  ) ?: throw IllegalStateException("Could not add audio to Ringtones.")
                                  contentResolver.openOutputStream(audioUri)?.use { output ->
                                      source.inputStream().use { input -> input.copyTo(output) }
                                  } ?: throw IllegalStateException("Could not write ringtone file.")
                                  RingtoneManager.setActualDefaultRingtoneUri(
                                      this, RingtoneManager.TYPE_RINGTONE, audioUri
                                  )
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("RINGTONE_ERROR", e.message, null)
                              }
                          }
                          "openSoundSettings" -> {
                              try {
                                  startActivity(Intent(Settings.ACTION_SOUND_SETTINGS))
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("SETTINGS_ERROR", e.message, null)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }

                  pipChannel = MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      pipChannelName
                  )

                  pipChannel?.setMethodCallHandler { call, result ->
                      if (call.method == "enterPip") {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              try {
                                  val width = call.argument<Int>("width") ?: 16
                                  val height = call.argument<Int>("height") ?: 9

                                  val params = PictureInPictureParams.Builder()
                                      .setAspectRatio(Rational(width, height))
                                      .build()

                                  result.success(enterPictureInPictureMode(params))
                              } catch (e: Exception) {
                                  result.error("PIP_ERROR", e.message, null)
                              }
                          } else {
                              result.error(
                                  "UNSUPPORTED",
                                  "Picture-in-picture requires Android 8.0 or later.",
                                  null
                              )
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onPictureInPictureModeChanged(
                  isInPictureInPictureMode: Boolean,
                  newConfig: Configuration
              ) {
                  super.onPictureInPictureModeChanged(
                      isInPictureInPictureMode,
                      newConfig
                  )

                  pipChannel?.invokeMethod(
                      "pipChanged",
                      mapOf("isInPipMode" to isInPictureInPictureMode)
                  )
              }
          }
          '''.replace("PACKAGE_NAME", package_name)

          activity.write_text(new_content)
          print("Picture-in-Picture Android configuration added.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Swipe-Player-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
